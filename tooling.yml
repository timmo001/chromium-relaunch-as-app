---
# Tool releases chromium-relaunch-as-app was last reviewed against. The
# tooling-drift tool (mise run tooling:status / tooling:publish) compares each
# with the latest release and opens a draft pull request for review when it
# moves; its README documents this file.
assignee: timmo001
dispatch:
  - build.yml
  - lint-general.yml
tools:
  - repo: omacom/omarchy
    reviewed: v4.5.0-rc2
    prereleases: true
    review: >-
      Check that omarchy-launch-webapp keeps its name, its
      ~/.local/share/omarchy/bin location and its <url> first argument
      against the relaunch host and installer in src/native.
