[tools]
bun = "1.4.5"
node = "26.13.1"
# The linters the shared hk pre-push hook runs.
uv = "0.13.9"
# yamllint's PyYAML has no wheels for Python 3.15 yet, which mise lock needs.
python = "3.14.10"
"pipx:yamllint" = "1.38.0"
"npm:markdownlint-cli2" = "0.24.2"
actionlint = "1.7.12"
shellcheck = "0.11.0"

[tasks.install]
run = "bun install --frozen-lockfile"

[tasks.lint]
depends = ["install"]
run = "bun run lint"

[tasks.typecheck]
depends = ["install"]
run = "bun run typecheck"

[tasks.build]
depends = ["typecheck"]
run = "bun run build"

[tasks.test]
depends = ["install"]
run = "bun run test"

[tasks.format]
depends = ["install"]
run = "bun run format"

[tasks."format:check"]
depends = ["install"]
run = "bun run format:check"

[tasks.check]
depends = ["lint", "typecheck", "test", "format:check", "build"]

