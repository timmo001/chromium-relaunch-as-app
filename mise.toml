[tools]
bun = "1.4.0"
node = "26.8.1"

[tasks.install]
run = "bun install --frozen-lockfile"

[tasks.lint]
depends = ["install"]
run = "bun run lint"

[tasks.typecheck]
depends = ["install"]
run = "bun run typecheck"

[tasks.build]
depends = ["typecheck"]
run = "bun run build"

[tasks.test]
depends = ["install"]
run = "bun run test"

[tasks.format]
depends = ["install"]
run = "bun run format"

[tasks."format:check"]
depends = ["install"]
run = "bun run format:check"

[tasks.check]
depends = ["install"]
run = "bun run check"
